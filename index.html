<!DOCTYPE html>
<html>
<head>
    <title>خريطة مشاريعي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* حدد طول وعرض الخريطة */
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>

    <h2>خريطة انتشار مشاريعنا في المملكة</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة لتركز على السعودية
        var map = L.map('map').setView([24.7136, 46.6753], 5); 

        // إضافة شكل الخريطة من OpenStreetMap (مجاني)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // إضافة نقاط (الرياض، جدة، مكة)
        L.marker([24.7136, 46.6753]).addTo(map).bindPopup('مشاريعنا في الرياض');
        L.marker([21.4858, 39.1925]).addTo(map).bindPopup('خدماتنا في جدة');
        L.marker([21.3891, 39.8579]).addTo(map).bindPopup('خدماتنا في مكة');
    </script>
</body>
</html>
